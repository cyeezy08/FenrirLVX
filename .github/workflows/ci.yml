# Build, vet, test and lint on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files not gofmt-clean:\n%s\n' "$unformatted"
            gofmt -d pkg/engine/fingerprint.go | head -100
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test ./... -race -count=1 -timeout 120s

      - name: Offline advisory matching microbenchmark
        if: matrix.os == 'ubuntu-latest'
        run: go test ./pkg/engine -run '^        shell: bash
        run: |
          go run . version
          go run . --help

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest". The v1 line is built with go1.24 and cannot
          # read a go.mod declaring go 1.27, so it exits with "can't load
          # config" before linting anything. v2.14.0 is built with go1.27.
          version: v2.14.0
          args: --timeout 5m
 -bench '^BenchmarkLocalAdvisoryMatching        shell: bash
        run: |
          go run . version
          go run . --help

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest". The v1 line is built with go1.24 and cannot
          # read a go.mod declaring go 1.27, so it exits with "can't load
          # config" before linting anything. v2.14.0 is built with go1.27.
          version: v2.14.0
          args: --timeout 5m
 -benchtime=200ms -benchmem

      - name: CLI smoke test
        shell: bash
        run: |
          go run . version
          go run . --help

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest". The v1 line is built with go1.24 and cannot
          # read a go.mod declaring go 1.27, so it exits with "can't load
          # config" before linting anything. v2.14.0 is built with go1.27.
          version: v2.14.0
          args: --timeout 5m
